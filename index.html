                                    function playTypingAnimation(text) {

                                            setTimeout(() => { typingAnimationElement.textContent += text[i]; }, i * 120);

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const form = e.target;
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const responseDiv = document.getElementById('formResponse');
            
            // Show loading state
            submitBtn.disabled = true;
            btnText.textContent = "Sending...";
            btnSpinner.classList.remove('d-none');
            responseDiv.textContent = "";
            responseDiv.style.color = "";
            
            const formData = new FormData(form);
            const object = Object.fromEntries(formData);
            const json = JSON.stringify(object);
            
            fetch("https://formsubmit.co/ajax/surajyadav2823510@gmail.com", {
                method: "POST",
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: json
            })
            .then(async (response) => {
                const data = await response.json();
                if (response.ok) {
                    responseDiv.style.color = "#28a745"; // Green for success
                    responseDiv.textContent = "Message sent successfully! Thank you.";
                    form.reset();
                } else {
                    responseDiv.style.color = "#dc3545"; // Red for error
                    responseDiv.textContent = data.message || "Failed to send message. Please try again.";
                }
            })
            .catch(error => {
                console.error(error);
                responseDiv.style.color = "#dc3545";
                responseDiv.textContent = "An error occurred. Please try again later.";
            })
            .finally(() => {
                // Reset button state
                submitBtn.disabled = false;
                btnText.textContent = "Send Message";
                btnSpinner.classList.add('d-none');
            });
        });
    </script>
